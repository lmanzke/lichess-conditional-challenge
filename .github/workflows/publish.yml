name: Publish

# Releases are made by pushing a tag like v2.1.1 that matches the version in package.json.
# The package is only uploaded as a draft to the Chrome Web Store, it is submitted for review by hand there.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(bun -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build-zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist-zip/*.zip
          if-no-files-found: error

  chrome-web-store:
    needs: check
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to approve each release manually.
    environment: chrome-web-store
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist-zip
      - name: Upload as a draft
        run: bunx chrome-webstore-upload-cli@4.0.2 upload --source dist-zip/*.zip
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

  github-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist-zip
      - name: Create release with the zip
        run: gh release create "$GITHUB_REF_NAME" dist-zip/*.zip --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
